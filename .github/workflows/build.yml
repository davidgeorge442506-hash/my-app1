name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev git zip unzip autoconf automake libtool pkg-config cmake ninja-build ccache lld lib32z1 lib32stdc++6
          pip install --upgrade pip setuptools "buildozer>=1.5.0" cython

      - name: Enable Android SDK License Acceptance
        run: |
          if grep -q "android.accept_sdk_license" buildozer.spec; then
            sed -i 's/^#\?\s*android.accept_sdk_license\s*=.*/android.accept_sdk_license = True/' buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app
          path: bin/*.apk
          name: my-android-app
          path: bin/*.apk
