name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. جلب سورس كود المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. إعداد بيئة Java JDK (مطلوبة لبناء تطبيقات Android)
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. إعداد بيئة Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 5. تثبيت مكتبات Python المطلوبة
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      # 6. بناء ملف الـ APK مع إضافة --yes لمنع الأسئلة التفاعلية
      - name: Build Android APK
        run: |
          flet build apk --yes --build-number 1 --build-version 1.0.0

      # 7. رفع ملف الـ APK كـ Artifact لتتمكن من تحميله بعد انتهاء التشغيل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
