name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      # تشغيل الأمر داخل Pseudo-terminal (pty) خدعة لإقناع Flet بأن الشاشة تفاعلية وتلقيم خيار الإجابة نعم تلقائياً
      - name: Build Android APK
        run: |
          python -c "
          import pty, os, subprocess

          master, slave = pty.openpty()
          cmd = ['flet', 'build', 'apk', '--build-number', '1', '--build-version', '1.0.0']
          proc = subprocess.Popen(cmd, stdin=slave, stdout=slave, stderr=slave, close_fds=True)
          os.close(slave)

          # إرسال الإجابة تلقائياً للطرفية التفاعلية
          os.write(master, b'y\n')
          
          while True:
              try:
                  data = os.read(master, 1024)
                  if not data:
                      break
                  print(data.decode('utf-8', errors='ignore'), end='')
              except OSError:
                  break

          proc.wait()
          if proc.returncode != 0:
              exit(proc.returncode)
          "

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/apk/*.apk
