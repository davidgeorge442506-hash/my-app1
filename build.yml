name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # تثبيت إصدار Flutter المطلوبة خصيصاً من Flet لتفادي طلب التثبيت التفاعلي
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build Android APK
        env:
          CI: 'true'
        run: |
          python -c "
          import os, subprocess
          os.environ['CI'] = 'true'
          cmd = ['flet', 'build', 'apk', '--no-interactive', '--build-number', '1', '--build-version', '1.0.0']
          p = subprocess.Popen(cmd, stdin=subprocess.PIPE, text=True)
          p.communicate(input='y\ny\ny\n')
          if p.returncode != 0:
              exit(p.returncode)
          "

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/apk/*.apk
